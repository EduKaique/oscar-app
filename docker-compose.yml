services:
  db:
    image: postgres:17
    container_name: db
    environment:
      POSTGRES_DB: oscar
      POSTGRES_USER: oscar
      POSTGRES_PASSWORD: oscar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscar -d oscar"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/oscar
      SPRING_DATASOURCE_USERNAME: oscar
      SPRING_DATASOURCE_PASSWORD: oscar
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
